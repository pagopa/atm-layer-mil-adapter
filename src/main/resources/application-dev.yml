# ------------------------------------------------------------------------------
# GEC paymentMethod and touchpoint remapping
# ------------------------------------------------------------------------------
gec:
  touchpoint:
    map:
      ATM: ATM
      CASH_REGISTER: ANY
      TOTEM: ANY
      POS: POS
      CSA: ANY
  paymentmethod:
    map:
      CASH: ANY
      BANK_ACCOUNT: ANY
      CREDIT_CARD: CP
      PAGOBANCOMAT: CP
      DEBIT_CARD: CP
      PAYMENT_CARD: CP
